version: 2
project_name: pftw
dist: dist/release
before:
  hooks:
    # Stamp the release version into the Windows file properties. Snapshots use winres.json as committed,
    # so a local snapshot leaves the generated resources unchanged.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/pftw/winres/winres.json --out cmd/pftw/rsrc --arch amd64,arm64,386 {{ if not .IsSnapshot }}--product-version {{ .Version }} --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0{{ end }}
builds:
  - id: pftw
    main: ./cmd/pftw
    binary: pftw
    env: [CGO_ENABLED=0]
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/matthewdeanmartin/python_for_the_win/internal/cli.Version={{.Version}} -X github.com/matthewdeanmartin/python_for_the_win/internal/cli.Commit={{.Commit}} -X github.com/matthewdeanmartin/python_for_the_win/internal/cli.Date={{.Date}}
  - id: pftww
    main: ./cmd/pftww
    binary: pftww
    env: [CGO_ENABLED=0]
    goos: [windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w -H windowsgui]
archives:
  - id: zip
    allow_different_binary_count: true # Windows additionally includes the GUI-subsystem shim.
    formats: [zip]
    name_template: 'pftw_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files: [LICENSE, README.md, CHANGELOG.md]
  - id: raw
    ids: [pftw]
    formats: [binary]
    name_template: 'pftw_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: linux
        formats: [none]
      - goos: darwin
        formats: [none]
checksum:
  name_template: checksums.txt
  extra_files: # The one-line install scripts, pinned to this release.
    - glob: ./install.sh
    - glob: ./install.ps1
snapshot:
  version_template: '{{ incpatch .Version }}-dev.{{ .ShortCommit }}'
changelog:
  disable: true # kaclm writes the release notes from CHANGELOG.md.
release:
  github:
    owner: matthewdeanmartin
    name: python_for_the_win
  extra_files:
    - glob: ./install.sh
    - glob: ./install.ps1
  prerelease: auto
  mode: keep-existing # The draft release made by kaclm keeps its notes; goreleaser only adds assets.
  header: |
    Windows installer manager. Linux/macOS artifacts are unsupported for installing Python.
    The Windows executables are currently unsigned. No py/pyw launcher or file associations are installed.
scoops:
  - name: pftw
    skip_upload: true # Workflow enriches checkver/autoupdate, then commits this generated manifest.
    ids: [zip]
    directory: bucket
    homepage: https://github.com/matthewdeanmartin/python_for_the_win
    description: Install official Python without a system installer
    license: MIT
    repository:
      owner: matthewdeanmartin
      name: python_for_the_win
      branch: main
