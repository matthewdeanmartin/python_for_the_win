name: Create Draft Release
# Keeps a draft GitHub release in sync with CHANGELOG.md's [Unreleased] section. Publishing that draft
# on GitHub creates the tag and starts release.yml. See docs/releasing.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: changelog
  cancel-in-progress: false
jobs:
  draft:
    name: Sync draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create or update the draft release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Create or update the draft release from [Unreleased]
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uvx --from keepachangelog-manager-fork==6.10.1 kaclm github-release --repository "$GITHUB_REPOSITORY"
