name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/*.exe
            dist/release/checksums.txt

      - uses: actions/checkout@v4
        with:
          ref: main
          path: scoop-bucket
      - name: Update this repository's Scoop bucket
        run: |
          go run ./internal/scoopmeta/cmd dist/release/scoop/bucket/pftw.json scoop-bucket/bucket/pftw.json
          git -C scoop-bucket config user.name github-actions[bot]
          git -C scoop-bucket config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C scoop-bucket add bucket/pftw.json
          if ! git -C scoop-bucket diff --cached --quiet; then
            git -C scoop-bucket commit -m "Update pftw Scoop manifest"
            git -C scoop-bucket push origin main
          fi
