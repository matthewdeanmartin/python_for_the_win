name: Release
on:
  push:
    tags: ['v*']
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false # Never interrupt a half-published release.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the GitHub release and push the Scoop manifest commit.
      id-token: write # Sign build-provenance attestations.
      attestations: write # Store build-provenance attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false # Release artifacts must not depend on a poisonable cache.
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/*.exe
            dist/release/checksums.txt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The next step pushes the manifest commit, so this checkout keeps its token.
          # No artifact is uploaded from this checkout. zizmor: ignore[artipacked]
          persist-credentials: true
          ref: main
          path: scoop-bucket
      - name: Update this repository's Scoop bucket
        run: |
          go run ./internal/scoopmeta/cmd dist/release/scoop/bucket/pftw.json scoop-bucket/bucket/pftw.json
          git -C scoop-bucket config user.name github-actions[bot]
          git -C scoop-bucket config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C scoop-bucket add bucket/pftw.json
          if ! git -C scoop-bucket diff --cached --quiet; then
            git -C scoop-bucket commit -m "Update pftw Scoop manifest"
            git -C scoop-bucket push origin main
          fi
