name: Release
# Runs when a draft release is published on GitHub (which also creates the tag). Nothing is built here:
# create_draft_release.yml attached every file to the draft, and published releases are immutable.
# This workflow verifies those files, publishes the wheels to PyPI and opens the release PR.
# No one tags or builds releases on a workstation. See docs/releasing.md.
# Run it by hand (Actions → Release → Run workflow, or `gh workflow run release.yml -f tag=v0.1.2`) to
# verify and publish an already-published release's wheels to PyPI later; that skips the PR and Scoop jobs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release whose wheels go to PyPI, e.g. v0.1.2
        required: true
        type: string
permissions: {}
env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false # Never interrupt a half-published release.
jobs:
  bump:
    name: Changelog release PR
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the release/bump branch.
      pull-requests: write # Open the release PR.
    outputs:
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Move [Unreleased] into the release, push a branch and open a PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          # The draft's target is the exact build commit; the PR goes to the default branch.
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          VERSION="${RELEASE_TAG#v}"
          uvx --from keepachangelog-manager-fork==6.10.1 kaclm release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}: changelog and Scoop manifest." \
            --github-output \
            --yes

  verify:
    name: Verify release files on Windows
    runs-on: windows-latest
    permissions:
      contents: read # Download the release's files.
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check checksums, the built commit, and the wheels
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only published releases resolve here (drafts return 404), so a manual run can't publish a draft.
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .tag_name
          TAG_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir assets
          (cd assets && sha256sum -c checksums.txt)
          ls assets/*.whl assets/pftw.scoop.json
          python -m pip install --only-binary :all: --no-index --find-links assets pftw
          pftw version | grep -F "pftw ${RELEASE_TAG#v} "
          python -m pftw version | grep -F "pftw ${RELEASE_TAG#v} "
          # The files must come from the commit the tag points at.
          pftw version --json | grep -F "\"commit\":\"$TAG_COMMIT\""

  pypi:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pftw
    permissions:
      contents: read # Download the wheels attached to the release.
      id-token: write # PyPI trusted publishing; no API token is stored.
    steps:
      - name: Download the release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.whl' --dir dist/wheels
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Validate metadata before uploading
        run: uvx twine@7.0.0 check --strict dist/wheels/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/wheels

  scoop:
    name: Add Scoop manifest to the release PR
    needs: [bump, verify]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the manifest to the release PR branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.bump.outputs.branch }}
      - name: Commit the release's Scoop manifest to the release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.bump.outputs.branch }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern pftw.scoop.json --output bucket/pftw.json --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pftw.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: Scoop manifest for ${RELEASE_TAG} [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
