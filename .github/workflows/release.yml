name: Release
# Runs when the kaclm draft release is published on GitHub (which also creates the tag).
# No one tags or builds releases on a workstation. See docs/releasing.md.
on:
  release:
    types: [published]
permissions: {}
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false # Never interrupt a half-published release.
jobs:
  bump:
    name: Changelog release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the release/bump branch.
      pull-requests: write # Open the release PR.
    outputs:
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Move [Unreleased] into the release, push a branch and open a PR
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          BASE_BRANCH: ${{ github.event.release.target_commitish }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          VERSION="${RELEASE_TAG#v}"
          uvx --from keepachangelog-manager-fork==6.10.1 kaclm release-bump \
            --version "$VERSION" \
            --base "$BASE_BRANCH" \
            --release-id "$RELEASE_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --open-pr \
            --title "chore: release ${VERSION}" \
            --body "Automated release PR for ${VERSION}: changelog and Scoop manifest." \
            --github-output \
            --yes

  build:
    name: Build and attach release assets
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser uploads assets to the published release.
      id-token: write # Sign build-provenance attestations.
      attestations: write # Store build-provenance attestations.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false # Release artifacts must not depend on a poisonable cache.
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build PyPI wheels from the release binaries
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: make release-wheels VERSION="$RELEASE_TAG"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.zip
            dist/release/*.exe
            dist/release/checksums.txt
            dist/wheels/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels
          path: dist/wheels/*.whl
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scoop-manifest
          path: dist/release/scoop/bucket/pftw.json
          if-no-files-found: error
          retention-days: 7

  check-wheels:
    name: Test-install wheels on Windows
    needs: build
    runs-on: windows-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist/wheels
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: pip install, then run pftw both ways
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install --only-binary :all: --no-index --find-links dist/wheels pftw
          pftw version | grep -F "pftw ${RELEASE_TAG#v} "
          python -m pftw version | grep -F "pftw ${RELEASE_TAG#v} "

  pypi:
    name: Publish to PyPI
    needs: check-wheels
    # Off until trusted publishing is configured; then set repository variable PYPI_PUBLISH=true.
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pftw
    permissions:
      id-token: write # PyPI trusted publishing; no API token is stored.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels
          path: dist/wheels
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Validate metadata before uploading
        run: uvx twine@7.0.0 check --strict dist/wheels/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/wheels

  scoop:
    name: Add Scoop manifest to the release PR
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push the manifest to the release PR branch.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.bump.outputs.branch }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scoop-manifest
          path: ${{ runner.temp }}/scoop
      - name: Commit the manifest to the release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.bump.outputs.branch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          go run ./internal/scoopmeta/cmd "$RUNNER_TEMP/scoop/pftw.json" bucket/pftw.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/pftw.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: Scoop manifest for ${RELEASE_TAG} [skip ci]"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
